spring.application.name=buspass
# Render (and most PaaS hosts) inject PORT; fall back to 8080 locally.
server.port=${PORT:8080}

# Persist data to ./data/buspass.mv.db so passes survive a restart.
spring.datasource.url=jdbc:h2:file:./data/buspass;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# Behind a reverse proxy/tunnel, honour X-Forwarded-Proto/Host so redirects and QR links use the public URL.
server.forward-headers-strategy=framework

# Dev-only database browser. Keep disabled on any public deployment.
spring.h2.console.enabled=false
