<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Something went wrong')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="page page-narrow">
    <section class="card empty-state error-page">
        <p class="error-code" th:text="${status} ?: '500'">500</p>
        <div>
            <h1>Something went wrong</h1>
            <p class="muted" th:text="${message} ?: 'Please try again. If it keeps happening, contact the bus pass cell.'">Please try again.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/dashboard}">Back to dashboard</a>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
