<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Access denied')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="page page-narrow">
    <section class="card empty-state error-page">
        <p class="error-code">403</p>
        <div>
            <h1>You do not have access</h1>
            <p class="muted" th:text="${message} ?: 'This page belongs to another account. Sign in with the right register number.'">Access denied.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/dashboard}">Back to dashboard</a>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
