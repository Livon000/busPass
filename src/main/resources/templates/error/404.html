<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Page not found')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="page page-narrow">
    <section class="card empty-state error-page">
        <p class="error-code">404</p>
        <div>
            <h1>We could not find that page</h1>
            <p class="muted" th:text="${message} ?: 'The link may be old, or the pass reference may be wrong.'">The link may be old.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/dashboard}">Back to dashboard</a>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
